services:
  mysql:
    image: mysql:8.0
    container_name: wim100-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wim100
    ports:
      - "3306:3306"
    volumes:
      - wim100-mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
    wim100-mysql-data:

